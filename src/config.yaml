site:
  name: AntreSehat
  site: 'https://antreshat.vercel.app'
  base: '/'
  trailingSlash: false

  # TODO(agen-deploy): ganti dengan URL produksi final saat deploy selesai.
  # googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: AntreSehat — Papan Antrean Digital Puskesmas
    template: '%s — AntreSehat'
  description: 'Papan antrean digital puskesmas — ambil nomor dari HP, pantau papan dari rumah.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: AntreSehat
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
    locale: id_ID
  twitter:
    handle: '@antreshat'
    site: '@antreshat'
    cardType: summary_large_image

i18n:
  language: id
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
